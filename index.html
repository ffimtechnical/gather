<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12603a" />
    <meta name="description" content="Map your neighbourhood, track visits and care for members." />
    <!-- Opens full screen, without the address bar, once added to the home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iPhones and iPads still read the apple-* names -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gather" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>FFIM Gather</title>
    <style>
      /* Launch screen: shown until the app has drawn its first screen */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center; align-content: center; gap: 28px;
        background: #eef3ec;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.gone { opacity: 0; visibility: hidden; }
      #splash .mark { position: relative; width: 168px; height: 168px; display: grid; place-items: center; }
      #splash .glow {
        position: absolute; inset: -40px; border-radius: 50%;
        background: radial-gradient(circle, rgba(31, 138, 76, 0.22) 0%, rgba(31, 138, 76, 0.08) 45%, rgba(31, 138, 76, 0) 70%);
        animation: splash-breathe 2.4s ease-in-out infinite;
      }
      #splash img {
        position: relative; width: 168px; height: 168px; object-fit: contain; padding: 12px; box-sizing: border-box;
        background: #ffffff; border-radius: 30px; box-shadow: 0 10px 30px -12px rgba(18, 96, 58, 0.35);
        animation: splash-rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #splash .track {
        width: 84px; height: 3px; border-radius: 3px; overflow: hidden; background: #d9e8cf;
        animation: splash-fade 0.4s 0.3s both;
      }
      #splash .track::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #1f8a4c;
        animation: splash-sweep 1.1s ease-in-out infinite;
      }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px) scale(0.94); } to { opacity: 1; transform: none; } }
      @keyframes splash-breathe { 0%, 100% { transform: scale(0.86); opacity: 0.6; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes splash-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-fade { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .glow, #splash .track, #splash .track::after { animation: none; }
        #splash .track::after { width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading FFIM Gather">
      <div class="mark"><span class="glow"></span><img src="/logo.png" alt="" /></div>
      <div class="track"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
